name: Build fluxneokernel (GKI android12-5.10)

on:
  workflow_dispatch:
    inputs:
      target_sublevel:
        description: "5.10 sublevel to build (stops if Google's branch has no commit at this sublevel)"
        default: "270"
      tick_hz:
        description: "Kernel tick rate (500 needs a small Kconfig patch, applied automatically)"
        type: choice
        options: ["500", "250", "300", "1000"]
        default: "500"
      root_driver:
        description: "nova-susfs = SukiSU-Nova driver with SUSFS (default). fluxsu = your FluxSU driver (no SUSFS in it yet)."
        type: choice
        options: [nova-susfs, fluxsu, none]
        default: nova-susfs
      nova_branch:
        description: "SukiSU-Nova branch that carries the SUSFS integration"
        default: "builtin-new"
      susfs_branch:
        description: "susfs4ksu (gitlab simonpunk) branch for the kernel patch"
        default: "gki-android12-5.10"
      version_suffix:
        description: "Suffix in the kernel release string (uname -r)"
        default: "fluxneokernel"
      build_user:
        description: "user shown in /proc/version"
        default: "flux"
      build_host:
        description: "host shown in /proc/version"
        default: "neokernel"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      KERNEL_NAME: fluxneokernel
      MANIFEST_BRANCH: common-android12-5.10
      TARGET: ${{ inputs.target_sublevel }}
      TICK: ${{ inputs.tick_hz }}
      ROOT_DRIVER: ${{ inputs.root_driver }}
      NOVA_BRANCH: ${{ inputs.nova_branch }}
      SUSFS_BRANCH: ${{ inputs.susfs_branch }}
      VERSION_SUFFIX: ${{ inputs.version_suffix }}
      BUILD_USER_NAME: ${{ inputs.build_user }}
      BUILD_HOST_NAME: ${{ inputs.build_host }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip unzip curl \
            zlib1g-dev libc6-dev-i386 libssl-dev bc cpio rsync lz4 python3 libelf-dev xz-utils patch
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "fluxneokernel-ci"
          git config --global user.email "ci@fluxneokernel.invalid"
          git config --global color.ui false

      - name: Sync Google GKI source (android12-5.10)
        run: |
          mkdir -p "$HOME/kernel" && cd "$HOME/kernel"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$MANIFEST_BRANCH" --depth=1 --no-clone-bundle
          repo sync -c --no-tags --no-clone-bundle -j"$(nproc)"
          df -h /

      - name: Pin source to the target sublevel
        run: |
          exec > >(tee -a "$HOME/steps.log") 2>&1
          cd "$HOME/kernel/common"
          REMOTE=$(git remote | head -n1)
          ok=0
          for i in 1 2 3 4 5; do
            if git fetch --no-tags --depth=6000 "$REMOTE" android12-5.10; then ok=1; break; fi
            echo "fetch attempt $i failed, retrying in 30s"; sleep 30
          done
          if [ "$ok" != 1 ]; then echo "::error::could not fetch android12-5.10 history from Google after 5 tries"; exit 1; fi
          set +o pipefail
          FOUND=""
          for c in $(git rev-list --first-parent FETCH_HEAD); do
            sub=$(git show "$c:Makefile" | head -n 6 | sed -n 's/^SUBLEVEL = *//p')
            if [ "$sub" = "$TARGET" ]; then FOUND="$c"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::No commit with SUBLEVEL=$TARGET in the last 6000 commits of android12-5.10."
            echo "Branch tip is: $(git show FETCH_HEAD:Makefile | head -n 6 | tr '\n' ' ')"
            exit 1
          fi
          git checkout -q "$FOUND"
          echo "Building 5.10.$(sed -n 's/^SUBLEVEL = *//p' Makefile | head -n1) at $FOUND"
          echo "KVER=5.10.$TARGET" >> "$GITHUB_ENV"

      - name: Report which listed fixes this tree contains
        run: |
          cd "$HOME/kernel/common"
          rep() {
            name="$1"; pat="$2"
            hit=$(git log --oneline -i -E --grep="$pat" HEAD | head -n1)
            if [ -n "$hit" ]; then echo "[in tree   ] $name: $hit"; return; fi
            hit=$(git log --oneline -i -E --grep="$pat" FETCH_HEAD | head -n1)
            if [ -n "$hit" ]; then echo "[newer only] $name: $hit"; else echo "[not found ] $name"; fi
          }
          {
            rep "Arm Optimized Routines string functions" "Optimized Routines|Cortex Strings"
            rep "cpuidle menu/teo disabled state" "cpuidle: (menu|teo)"
            rep "uclamp_max iowait boost" "uclamp"
            rep "freezer_should_skip on_rq" "freezer"
            rep "binder TF_UPDATE_TXN" "TF_UPDATE_TXN"
            rep "PSI trigger use-after-free" "psi.*(use-after-free|race)"
            rep "f2fs infinite loop" "f2fs.*(infinite|endless) loop"
            rep "UFS shutdown/divide fixes" "ufs.*(shutdown|divide)"
            rep "FUSE passthrough" "fuse.*passthrough"
            rep "erofs double free" "erofs.*double free"
            rep "iomap writeback corruption" "iomap.*(writeback|corruption)"
            rep "freeze_bdev accounting" "freeze_bdev"
            rep "USB f_midi / u_serial" "f_midi|u_serial"
            rep "CMA in swap-in" "(cma|CMA).*swap|swap.*(cma|CMA)"
            rep "swap-in workingset" "swap.*workingset|workingset.*swap"
            rep "zram reset/disksize race" "zram.*(reset|disksize)"
            rep "schedutil next_freq on limits change" "schedutil.*(next_freq|limits)"
          } | tee "$HOME/fixes-report.txt"

      - name: Add root driver
        if: env.ROOT_DRIVER != 'none'
        run: |
          exec > >(tee -a "$HOME/steps.log") 2>&1
          cd "$HOME/kernel"
          if [ "$ROOT_DRIVER" = "fluxsu" ]; then
            REPO=https://github.com/Alexdev01-spectrum/FluxSU; BR=main
          else
            REPO=https://github.com/SukiSU-Nova/SukiSU-Nova; BR="$NOVA_BRANCH"
          fi
          git clone --depth=1 -b "$BR" "$REPO" KernelSU
          echo "ROOT_INFO=$REPO@$BR $(git -C KernelSU rev-parse --short HEAD)" >> "$GITHUB_ENV"
          cd common/drivers
          ln -sfn ../../KernelSU/kernel kernelsu
          grep -q kernelsu Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> Makefile
          grep -q 'drivers/kernelsu/Kconfig' Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' Kconfig
          echo "Root driver: $REPO ($BR)"
          grep -c SUSFS "$HOME/kernel/KernelSU/kernel/Kconfig" || true

      - name: Apply SUSFS kernel patch
        if: env.ROOT_DRIVER == 'nova-susfs'
        run: |
          exec > >(tee -a "$HOME/steps.log") 2>&1
          cd "$HOME"
          git clone --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          SUSFS_COMMIT=$(git -C susfs4ksu rev-parse --short HEAD)
          SUSFS_VER=$(grep -rhoE 'SUSFS_VERSION[^"]*"[^"]+"' susfs4ksu/kernel_patches/include/linux/susfs.h | head -n1 || true)
          echo "SUSFS_INFO=$SUSFS_BRANCH@$SUSFS_COMMIT $SUSFS_VER" >> "$GITHUB_ENV"
          ls susfs4ksu/kernel_patches
          PATCH=$(ls susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10*.patch | head -n1)
          cp "$PATCH" kernel/common/susfs.patch
          cp -r susfs4ksu/kernel_patches/fs/* kernel/common/fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* kernel/common/include/linux/
          cd kernel/common
          if ! patch -p1 -F3 --no-backup-if-mismatch --dry-run < susfs.patch; then
            echo "::error::SUSFS patch does not apply cleanly on this 5.10.$TARGET tree."
            exit 1
          fi
          patch -p1 -F3 --no-backup-if-mismatch < susfs.patch
          rm -f susfs.patch
          find . -name '*.rej' -o -name '*.orig' | head
          echo "--- SUSFS_LOGI_RL definitions ---"
          grep -rn "define SUSFS_LOGI_RL" include fs || true
          if ! grep -rqs "define SUSFS_LOGI_RL" include fs; then
            echo "SUSFS_LOGI_RL missing in this susfs version, adding a ratelimited fallback"
            printf '\n#ifndef SUSFS_LOGI_RL\n#define SUSFS_LOGI_RL(fmt, ...) pr_info_ratelimited(fmt, ##__VA_ARGS__)\n#endif\n' >> include/linux/susfs.h
          fi

      - name: Apply branding, baked-in tweaks and config
        run: |
          exec > >(tee -a "$HOME/steps.log") 2>&1
          cd "$HOME/kernel/common"
          S=scripts/config
          F=arch/arm64/configs/gki_defconfig
          echo "stock HZ lines in gki_defconfig: $(grep -E '^CONFIG_HZ' $F | tr '\n' ' ')"

          # 500 Hz is not in mainline Kconfig.hz (100/250/300/1000): add it
          python3 - "$TICK" <<'PY'
          import sys
          tick = sys.argv[1]
          if tick == "500":
              import os
              p = "kernel/Kconfig.hz" if os.path.exists("kernel/Kconfig.hz") else "arch/Kconfig.hz"
              s = open(p).read()
              if "HZ_500" not in s:
                  a = '\tconfig HZ_1000\n\t\tbool "1000 HZ"'
                  c = "\tdefault 1000 if HZ_1000"
                  if a not in s or c not in s:
                      print("::error::Kconfig.hz layout differs, cannot add 500 Hz")
                      sys.exit(1)
                  s = s.replace(a, '\tconfig HZ_500\n\t\tbool "500 HZ"\n\t\thelp\n\t\t 500 Hz balanced tick rate.\n\n' + a, 1)
                  s = s.replace(c, "\tdefault 500 if HZ_500\n" + c, 1)
                  open(p, "w").write(s)
              print("500 Hz option available")
          PY

          # baked-in runtime defaults (each patch is verified, never fatal)
          python3 - <<'PY'
          import re, os
          applied, skipped = [], []
          def patch(path, pat, rep, name):
              try:
                  s = open(path).read()
              except OSError:
                  skipped.append("%s: %s missing" % (name, path)); return
              n, c = re.subn(pat, rep, s, count=1, flags=re.M)
              if c:
                  open(path, "w").write(n); applied.append(name)
              else:
                  skipped.append("%s: pattern not found" % name)
          patch("mm/vmscan.c", r"^(int vm_swappiness = )60;", r"\g<1>100;", "vm.swappiness 60 -> 100")
          patch("fs/dcache.c", r"^(int sysctl_vfs_cache_pressure __read_mostly = )100;", r"\g<1>60;", "vfs_cache_pressure 100 -> 60")
          patch("net/ipv4/tcp_ipv4.c", r"(net->ipv4\.sysctl_tcp_slow_start_after_idle = )1;", r"\g<1>0;", "tcp_slow_start_after_idle 1 -> 0")
          patch("net/ipv4/tcp_ipv4.c", r"(net->ipv4\.sysctl_tcp_fastopen = )TFO_CLIENT_ENABLE;", r"\g<1>TFO_CLIENT_ENABLE | TFO_SERVER_ENABLE;", "tcp_fastopen client+server")
          patch("include/linux/pagemap.h", r"^(#define VM_READAHEAD_PAGES\s+\()SZ_128K( / PAGE_SIZE\))", r"\g<1>SZ_256K\g<2>", "default readahead 128K -> 256K")
          out = "\n".join(["applied: " + a for a in applied] + ["skipped: " + x for x in skipped]) + "\n"
          open(os.environ["HOME"] + "/tweaks-applied.txt", "w").write(out)
          print(out)
          PY

          # tidy compiler banner in /proc/version
          python3 - <<'PY'
          p = "scripts/mkcompile_h"
          s = open(p).read()
          marker = "#define LINUX_COMPILER"
          if marker in s and "flux-clean" not in s:
              out = []
              for ln in s.split("\n"):
                  if marker in ln:
                      out.append("# flux-clean: tidy compiler banner")
                      out.append(r"""CC_VERSION=$(printf '%s' "$CC_VERSION" | sed -E 's/ \(https?:[^)]*\)//g; s/ \([0-9]+, based on [^)]*\)//g')""")
                      out.append(r"""LD_VERSION=$(printf '%s' "$LD_VERSION" | sed -E 's/ \(\/[^)]*\)//g')""")
                  out.append(ln)
              open(p, "w").write("\n".join(out))
              print("compiler banner patched")
          else:
              print("compiler banner left as is")
          PY

          # release string: <ver>-android12-9-<suffix> (keeps the KMI part, drops the git hash)
          if [ -f scripts/setlocalversion ] && [ ! -f scripts/setlocalversion.orig ]; then
            mv scripts/setlocalversion scripts/setlocalversion.orig
            cat > scripts/setlocalversion <<EOS
          #!/bin/sh
          d=\$(dirname "\$0")
          out=\$(sh "\$d/setlocalversion.orig" "\$@")
          rc=\$?
          printf '%s' "\$out" | sed -E 's/-g[0-9a-f]{7,40}/-${VERSION_SUFFIX}/; s/-dirty//'
          exit \$rc
          EOS
            chmod +x scripts/setlocalversion
          fi

          # config
          for h in 100 250 300 500 1000; do [ "$h" = "$TICK" ] || $S --file $F -d HZ_$h; done
          $S --file $F -e HZ_$TICK
          $S --file $F -e TCP_CONG_ADVANCED -e TCP_CONG_BBR -e TCP_CONG_WESTWOOD \
                       -d DEFAULT_CUBIC -e DEFAULT_BBR -e NET_SCH_FQ -e NET_SCH_FQ_CODEL \
                       -e NET_SCH_DEFAULT -e DEFAULT_FQ -d DEFAULT_PFIFO_FAST
          $S --file $F -e MQ_IOSCHED_KYBER -e IOSCHED_BFQ
          if [ "$ROOT_DRIVER" != "none" ]; then
            $S --file $F -e KSU -e KPROBES -e KPROBE_EVENTS
          fi
          if [ "$ROOT_DRIVER" = "nova-susfs" ]; then
            $S --file $F -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT \
                         -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SPOOF_UNAME \
                         -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                         -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP -e KSU_SUSFS_ENABLE_LOG
          fi
          grep -rl check_defconfig build.config* 2>/dev/null | xargs -r sed -i 's/check_defconfig/true/'
          cat > build.config.fluxneo <<'EOF'
          . ${ROOT_DIR}/${KERNEL_DIR}/build.config.gki.aarch64
          MODULES_ORDER=
          KMI_SYMBOL_LIST_STRICT_MODE=
          TRIM_NONLISTED_KMI=
          BUILD_SYSTEM_DLKM=
          BUILD_GKI_ARTIFACTS=
          BUILD_GKI_CERTIFICATION_TOOLS=
          IN_KERNEL_MODULES=
          BUILD_INITRAMFS=
          SKIP_CP_KERNEL_HDR=1
          MAKE_GOALS="Image"
          EOF
          git add -A
          git commit -qm "fluxneokernel: branding, baked-in tweaks, susfs, config"

      - name: Build GKI kernel
        shell: bash
        env:
          KBUILD_BUILD_USER: ${{ inputs.build_user }}
          KBUILD_BUILD_HOST: ${{ inputs.build_host }}
        run: |
          cd "$HOME/kernel"
          set +e
          LTO=thin BUILD_CONFIG=common/build.config.fluxneo build/build.sh -k 2>&1 | tee "$HOME/build.log"
          RC=${PIPESTATUS[0]}
          set -e
          IMG=$(find "$HOME/kernel/out" -path '*arch/arm64/boot/Image' -type f | head -n1)
          if [ -z "$IMG" ]; then
            echo "::error::Kernel Image was not produced (build.sh exit code $RC)"
            exit 1
          fi
          [ "$RC" -ne 0 ] && echo "::warning::build.sh exited $RC after producing the Image (post-build packaging only)"
          echo "IMAGE_PATH=$IMG" >> "$GITHUB_ENV"
          ls -lh "$IMG"
          BANNER=$(strings -a "$IMG" | grep -m1 -a '^Linux version 5\.' || true)
          echo "$BANNER"
          case "$BANNER" in *"$VERSION_SUFFIX"*) ;; *) echo "::warning::release string does not contain the suffix (branding patch did not apply)";; esac

      - name: Save failure log to repo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B="$HOME/build.log"
          {
            echo "run ${{ github.run_number }} root=$ROOT_DRIVER hz=$TICK"
            if [ -f "$HOME/steps.log" ]; then echo "== pre-build steps log (tail) =="; tail -60 "$HOME/steps.log" | cut -c1-300; fi
            if [ -f "$B" ]; then
              sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$B" > "$HOME/clean.log"
              echo "== compiler/linker errors =="
              grep -n -E "error:|fatal error|undefined (symbol|reference)|ld.lld: error|ERROR" "$HOME/clean.log" | cut -c1-320 | head -120
              echo "== context before first make failure =="
              L=$(grep -n -m1 -E '^make.*\*\*\*' "$HOME/clean.log" | cut -d: -f1)
              [ -n "$L" ] && sed -n "$((L>80?L-80:1)),$((L+4))p" "$HOME/clean.log" | cut -c1-320
              echo "== tail =="
              tail -40 "$HOME/clean.log" | cut -c1-320
            else
              echo "no build.log (failed before the build step)"
            fi
          } > "$HOME/failure.txt" || true
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/build-logs/run-${{ github.run_number }}.txt" \
            -f message="build failure log" -f content="$(base64 -w0 "$HOME/failure.txt")" -f branch=main

      - name: Show effective config
        run: |
          CFG=$(find "$HOME/kernel/out" -name .config -path '*common*' | head -n1)
          echo "Config file: $CFG"
          grep -E '^CONFIG_(HZ|HZ_[0-9]+|TCP_CONG_BBR|TCP_CONG_WESTWOOD|DEFAULT_TCP_CONG|DEFAULT_NET_SCH|NET_SCH_FQ|LOCALVERSION[A-Z_]*|MQ_IOSCHED_KYBER|IOSCHED_BFQ|PREEMPT|KSU[A-Z_]*|KPROBES)[= ]' "$CFG" | tee "$HOME/effective-config.txt"

      - name: Package kernel (AnyKernel3)
        run: |
          cd "$HOME"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cd ak3
          rm -rf .git .github README.md
          cp "$IMAGE_PATH" ./Image
          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 - fluxneokernel (GKI, kernel-only flash)
          properties() { '
          kernel.string=fluxneokernel
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF
          sed -i "s/^kernel.string=.*/kernel.string=fluxneokernel ${KVER} (${TICK} Hz)/" anykernel.sh
          case "$ROOT_DRIVER" in nova-susfs) TAG=susfs;; fluxsu) TAG=fluxsu;; *) TAG=noroot;; esac
          ZIP="${KERNEL_NAME}-${KVER}-${TICK}hz-${TAG}-$(date +%Y%m%d).zip"
          zip -r9 "$HOME/$ZIP" . -x '.git*'
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$HOME/$ZIP" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxneokernel-${{ env.KVER }}
          path: |
            ${{ env.ZIP_PATH }}
            /home/runner/effective-config.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BANNER=$(strings -a "$IMAGE_PATH" | grep -m1 -a '^Linux version 5\.' || true)
          {
            echo "fluxneokernel $KVER (GKI android12-5.10), ${TICK} Hz tick"
            echo
            echo "- Root driver: ${ROOT_INFO:-none}"
            echo "- SUSFS: ${SUSFS_INFO:-not included}"
            echo "- Network: BBR + fq by default, Westwood available; Kyber and BFQ selectable"
            echo
            echo "Version string:"
            echo '```'
            echo "$BANNER"
            echo '```'
            echo
            echo "Baked-in defaults:"
            echo '```'
            cat "$HOME/tweaks-applied.txt"
            echo '```'
            echo
            echo "<details><summary>Upstream fixes: what this tree contains</summary>"
            echo
            echo '```'
            cat "$HOME/fixes-report.txt"
            echo '```'
            echo "</details>"
            echo
            echo "<details><summary>Effective config</summary>"
            echo
            echo '```'
            cat "$HOME/effective-config.txt"
            echo '```'
            echo "</details>"
          } > "$HOME/notes.md"
          gh release create "${KVER}-r${{ github.run_number }}" "$ZIP_PATH" \
            --repo "$GITHUB_REPOSITORY" --title "fluxneokernel $KVER ($TICK Hz)" \
            --notes-file "$HOME/notes.md" --prerelease
